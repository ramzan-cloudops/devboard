name: CD
on:
  push:
    branches:
      - master  
jobs:
    deploy-frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'
            - name: Install dependencies
              working-directory: ./frontend
              run: npm ci
            - name: Run lint
              working-directory: ./frontend
              run: npm run lint
            - name: Run tests
              working-directory: ./frontend
              run: npm test
            - name: docker login
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
            - name: Build and push Docker image
              working-directory: ./frontend
              run: |
                docker build -t ${{ vars.DOCKER_USERNAME }}/devboard-frontend:latest .
                docker push ${{ vars.DOCKER_USERNAME }}/devboard-frontend:latest
    deploy-backend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                go-version: '1.22'
                go-version-file: go.mod
                cache-dependency-path: go.sum
                cache: false       # Disable setup-go cache to prevent conflicts with golangci-lint cache

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@v6
              with:
                version: v1.64  
                working-directory: ./backend
            - name: Run tests
              working-directory: ./backend
              run: go test ./...
            - name: docker login
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
            - name: Build and push Docker image
              working-directory: ./backend
              run: |
                docker build -t ${{ vars.DOCKER_USERNAME }}/devboard-backend:latest .
                docker push ${{ vars.DOCKER_USERNAME }}/devboard-backend:latest
            - name: Set up SSH
              uses: webfactory/ssh-agent@v0.8.1
              with:
                ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            - name: Deploy to server
              run: |
                ssh -o StrictHostKeyChecking=no user@your-server-ip << 'EOF'
                cd /path/to/your/project
                git pull origin master
                docker-compose down
                docker-compose up -d --build
                EOF
    