name: CI
#Goal : Build the  Dveboard frontend image  and  push   to docker hub 

on:
  push:
      branches:  [master]
jobs: 
  build-and-push:
    runs-on: ubuntu-latest
    steps:
# hero clone the code form own repository 
      - name: checkout the code 
        uses: actions/checkout@v4 
  # 4. Authenticate to Docker Hub
      - name: login in to docker hub
        uses: docker/login-action@v4
        with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

# Now we pus over builded devboard image to docker hub
      - name: build-and-push image to docker hub
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-fe-image:latest
            


    
      
