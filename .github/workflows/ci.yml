name: CI
on:
  push:
    branches:
      - master
jobs:
    frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'
            - name: Install dependencies
              working-directory: ./frontend
              run: npm ci
            - name: Run lint
              working-directory: ./frontend
              run: npm run lint
            - name: Run tests
              working-directory: ./frontend
              run: npm test
            - name: docker login
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
            - name: Build and push Docker image
              working-directory: ./frontend
              run: |
                docker build -t ${{ vars.DOCKER_USERNAME }}/devboard-frontend:latest .
                docker push ${{ vars.DOCKER_USERNAME }}/devboard-frontend:latest
